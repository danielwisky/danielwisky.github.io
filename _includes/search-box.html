<div id="search-box" class="search" role="dialog" aria-modal="true" aria-label="Pesquisar no blog"
     data-index="{{ '/search-index.json' | relative_url }}">
  <div class="search__box">
    <div class="search__group">
      {% include icon.html name="magnifying-glass" %}
      <label for="searchInput" class="screen-reader-text">Pesquisar</label>
      <input id="searchInput" type="text" name="q" maxlength="255" class="search__text"
             autocomplete="off" spellcheck="false" placeholder="Escreva para pesquisar...">
      <button id="search-close" class="search__close" type="button" aria-label="Fechar pesquisa">
        {% include icon.html name="xmark" %}
      </button>
    </div>

    <p id="searchStatus" class="search__status" role="status" aria-live="polite"></p>
    <ul id="searchResults" class="search-results-list"></ul>

    <div class="search__hint">
      <span><kbd>↑</kbd><kbd>↓</kbd> navegar</span>
      <span><kbd>Enter</kbd> abrir</span>
      <span><kbd>Esc</kbd> fechar</span>
    </div>
  </div>
</div>
