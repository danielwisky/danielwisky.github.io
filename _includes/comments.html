{%- if site.disqus -%}
<div class="disqus-comments">
  <div id="disqus_thread"></div>
  <script>
    /*
     * Disqus resolves the color scheme only once, when the embed loads, and
     * DISQUS.reset() doesn't recompute it: going from dark back to light left
     * the iframe with a light background and light text, unreadable.
     *
     * So the embed is recreated from scratch on every theme change. It's
     * cruder than reset(), but it's the only way to make Disqus re-evaluate
     * the color.
     */
    var disqus_shortname = '{{ site.disqus }}';

    function disqus_config() {
      // No page.identifier on purpose: existing threads are indexed by the full
      // URL, and setting a new identifier would orphan them.
      this.page.url = window.location.href.split('?')[0];
      this.page.colorScheme =
        document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    }

    window.loadDisqus = function () {
      var d = document;
      var thread = d.getElementById('disqus_thread');
      if (!thread) return;

      // Without clearing the previous state embed.js returns early, thinking it's
      // already mounted, and nothing gets reloaded.
      thread.innerHTML = '';
      d.querySelectorAll('script[data-disqus]').forEach(function (el) { el.remove(); });
      try { delete window.DISQUS; } catch (e) { window.DISQUS = undefined; }

      var s = d.createElement('script');
      s.src = 'https://' + disqus_shortname + '.disqus.com/embed.js?' + (+new Date());
      s.setAttribute('data-timestamp', +new Date());
      s.setAttribute('data-disqus', '');
      s.async = true;
      (d.head || d.body).appendChild(s);
    };

    /*
     * Loads only when the comments area gets close to the viewport. The Disqus
     * embed pulls in hundreds of KB of third-party code, and most visits to a
     * post never get this far.
     */
    (function () {
      var thread = document.getElementById('disqus_thread');
      if (!thread) return;

      if (!('IntersectionObserver' in window)) {
        window.loadDisqus();
        return;
      }

      var observer = new IntersectionObserver(function (entries) {
        if (!entries[0].isIntersecting) return;
        observer.disconnect();
        window.loadDisqus();
      }, { rootMargin: '400px' });

      observer.observe(thread);
    })();
  </script>
  <noscript>
    Ative o JavaScript para ver os
    <a href="https://disqus.com/?ref_noscript">comentários do Disqus</a>.
  </noscript>
</div>
{%- endif -%}
