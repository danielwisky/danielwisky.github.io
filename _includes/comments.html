{%- if site.disqus -%}
<div class="disqus-comments">
  <div id="disqus_thread"></div>
  <script>
    /*
     * O Disqus decide o esquema de cor uma única vez, no carregamento do
     * embed. Por isso a cor vai explícita em page.colorScheme, e o toggle de
     * tema (assets/js/main.js) chama DISQUS.reset() para recarregar a thread.
     */
    var disqus_shortname = '{{ site.disqus }}';

    function disqus_config() {
      // Sem page.identifier de propósito: as threads existentes estão indexadas
      // pela URL completa, e fixar um identifier novo as deixaria órfãs.
      this.page.url = window.location.href.split('?')[0];
      this.page.colorScheme =
        document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    }

    (function () {
      var d = document, s = d.createElement('script');
      s.src = 'https://' + disqus_shortname + '.disqus.com/embed.js';
      s.setAttribute('data-timestamp', +new Date());
      s.async = true;
      (d.head || d.body).appendChild(s);
    })();
  </script>
  <noscript>
    Ative o JavaScript para ver os
    <a href="https://disqus.com/?ref_noscript">comentários do Disqus</a>.
  </noscript>
</div>
{%- endif -%}
