{%- comment -%}
O lunr e o índice de busca não vêm mais aqui: o assets/js/search.js carrega os
dois sob demanda, na primeira vez que o overlay de busca é aberto.
{%- endcomment -%}
<script defer src="{{ '/assets/js/main.min.js' | relative_url }}?v={{ '/assets/js/main.min.js' | asset_hash }}"></script>
<script defer src="{{ '/assets/js/search.min.js' | relative_url }}?v={{ '/assets/js/search.min.js' | asset_hash }}"></script>
{%- if page.layout == 'post' %}
<script defer src="{{ '/assets/js/code-blocks.min.js' | relative_url }}?v={{ '/assets/js/code-blocks.min.js' | asset_hash }}"></script>
{%- endif %}
{%- if page.url contains '/contato' %}
<script defer src="{{ '/assets/js/contact.min.js' | relative_url }}?v={{ '/assets/js/contact.min.js' | asset_hash }}"></script>
{%- endif %}
