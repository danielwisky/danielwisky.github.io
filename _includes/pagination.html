{%- comment -%}
relative_url instead of absolute_url: infinite scroll fetches this href, and an
absolute URL with a host different from the current one becomes a cross-origin
request.
{%- endcomment -%}
{% if paginator.next_page %}
<div class="pagination">
  <a class="pagination__next button button--ghost" href="{{ paginator.next_page_path | relative_url }}">
    Próxima página &rarr;
  </a>
</div>
{% endif %}
