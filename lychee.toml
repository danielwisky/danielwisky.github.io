# lychee configuration, used by ci.yml (internal links) and links.yml
# (external links, monthly).

max_concurrency = 16
timeout = 20
max_retries = 2

# 403 and 429 almost always mean the site is blocking bots or rate limiting,
# not a broken link.
accept = ["200..=299", "403", "429"]

exclude = [
  # contact form POST endpoint: GET returns 405
  "^https://formspree\\.io/",
  # Pexels returns 404 to bots on author pages that do exist
  "^https://www\\.pexels\\.com/@",
]
