# Configuração do lychee, usada pelo ci.yml (links internos) e pelo links.yml
# (links externos, mensal).

max_concurrency = 16
timeout = 20
max_retries = 2

# 403 e 429 são, quase sempre, o site bloqueando robô ou limitando taxa, não
# link quebrado.
accept = ["200..=299", "403", "429"]

exclude = [
  # endpoint de POST do formulário de contato: GET responde 405
  "^https://formspree\\.io/",
  # o Pexels responde 404 para robô em páginas de autor que existem
  "^https://www\\.pexels\\.com/@",
]
