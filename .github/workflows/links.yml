# Weekly check of external links.
#
# Kept out of the pull request CI because external links break for reasons
# unrelated to the PR. Instead of failing, it opens (or comments on) a single
# issue labeled broken-links, so issues don't pile up week after week.
name: External links

on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --root-dir ${{ github.workspace }}/_site --no-progress _site
          fail: false

      # Comment instead of editing the body: edits don't notify anyone, so a link
      # breaking while the issue is already open would go unnoticed.
      - name: Update issue
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.lychee.outputs.exit_code }}
        run: |
          existing=$(gh issue list --label broken-links --state open --json number -q '.[0].number')
          case "$EXIT_CODE" in
            0)
              if [ -n "$existing" ]; then
                gh issue close "$existing" --comment "All external links are responding again."
              fi
              ;;
            2)
              if [ -n "$existing" ]; then
                gh issue comment "$existing" --body-file lychee/out.md
              else
                gh label create broken-links --color d73a4a --force
                gh issue create --title "Broken external links" --label broken-links --body-file lychee/out.md
              fi
              ;;
            *)
              # 1 and 3 are lychee runtime or config errors, not broken links
              echo "::error::lychee exited with code $EXIT_CODE"
              exit 1
              ;;
          esac
