# Pull request check.
#
# The deploy runs only Jekyll, and the generated artifacts (the .min.js files,
# the tag covers, the files in _data/) are committed. Without this check,
# editing assets/js/main.js and forgetting to run `npm run build:js` silently
# publishes the old .min.js. The `git diff --exit-code` below is the detector:
# if the build changes any versioned file, the commit is out of sync.
#
# Left out of the check on purpose:
#   build:videos  downloads YouTube thumbnails; it would depend on the network
#                 and be flaky
#   build:photos  depends on _photos/, which isn't versioned; on a clean runner
#                 it generates nothing (the script handles the missing folder)
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Regenerate deterministic artifacts
        run: |
          npm run build:js
          npm run build:covers

      - name: Discard artifacts that aren't reproducible across systems
        run: |
          # The tag cover .jpg files are rasterized from SVG by sharp, and the
          # result depends on the system fonts: macOS and Linux produce
          # different bytes for the same input. The .svg files, which are pure
          # string generation, stay in the check. Same goes for the app icons.
          git checkout -- assets/img/covers/og assets/img/app

      - name: Check that committed artifacts are up to date
        run: |
          if ! git diff --exit-code; then
            echo "::error::Artifacts out of sync. Run 'npm run build' and commit the result."
            exit 1
          fi

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # Internal links only: external ones are flaky (timeouts, bot blocking)
      # and would turn the PR red over something outside the repository. They
      # are checked once a month by links.yml.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir ${{ github.workspace }}/_site --no-progress _site
          fail: true
