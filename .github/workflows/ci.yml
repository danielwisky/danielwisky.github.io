# Pull request check: the site builds and no internal link is broken.
#
# The minified JS isn't versioned; the build-assets action produces it here and
# in the deploy. build:videos, build:photos and build:icons stay committed: they
# depend on the network or on _photos/, which isn't versioned.
name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/build-assets

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # Internal links only: external ones are flaky (timeouts, bot blocking)
      # and would turn the PR red over something outside the repository. They
      # are checked once a month by links.yml.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --root-dir ${{ github.workspace }}/_site --no-progress _site
          fail: true
