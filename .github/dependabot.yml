# Without this file Dependabot only opens security updates, with no schedule
# or grouping. The npm dependencies here are build tools that only run locally
# and in CI, so their security risk is low: the goal is to keep everything up
# to date without getting one PR per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      build-tools:
        patterns: ["*"]

  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: monthly
    groups:
      jekyll:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
