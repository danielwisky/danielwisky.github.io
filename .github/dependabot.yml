# Without this file Dependabot only opens security updates, with no schedule
# or grouping. The npm dependencies are build tools, plus lunr, which is
# copied into the site: the goal is to keep everything up to date without
# getting one PR per package.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    groups:
      build-tools:
        patterns: ["*"]

  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: monthly
    groups:
      jekyll:
        patterns: ["*"]

  # The composite action in .github/actions/ isn't scanned from "/" alone.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: monthly
