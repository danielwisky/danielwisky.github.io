# Generates the artifacts that aren't versioned (minified JS and vendored lunr)
# before the Jekyll build.
name: Build assets
description: Install npm dependencies and run build:js

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "22"
        cache: npm

    - run: npm ci
      shell: bash

    - run: npm run build:js
      shell: bash
