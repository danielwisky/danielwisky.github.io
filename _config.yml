title: Daniel Wisky
author: Daniel Wisky
email: daniel-ddw@hotmail.com
description: "Conteúdos sobre desenvolvimento de software e tecnologia"
baseurl: ""
url: https://danielwisky.com.br
lang: pt-BR

wisky_3dprint_url: "https://wisky3dprint.com.br"

sass:
  style: compressed
  # o .map de 53 KB ia para produção e nunca era requisitado
  sourcemap: never

# output options (more information on Jekyll's site)
markdown: kramdown
highlighter: rouge
permalink: "/:year-:month-:day-:title/"

pagination:
  enabled: true
  per_page: 10
  permalink: '/page/:num/'
  title: ':title - página :num'
  sort_reverse: true

kramdown:
  input: GFM

# fill in your Google Analytics ID to track your website using Google Analytics
google_analytics: "G-R9ZHFE3RQ5"

# to use Disqus comments, sign up to https://disqus.com and fill in your Disqus shortname (NOT the userid)
disqus: "danielwisky"

# ID do formulário do Formspree, de formspree.io -> seu form -> "Integration".
# O endpoint /f/ espera este ID, não um e-mail: o painel chega a exibir a URL
# com o e-mail, mas ela responde FORM_NOT_FOUND. O ID é o mesmo que aparece
# como `formId` nos exemplos de JS e React da própria documentação.
formspree_id: "mzbovjdk"

# O jekyll-seo-tag emite twitter:card; sem isto ele usaria "summary", com
# miniatura pequena. O username é necessário porque o plugin emite twitter:site
# de qualquer jeito, e sem ele a tag sai como "@" vazio.
twitter:
  username: danielwisky
  card: summary_large_image

# --- footer social media links --- #
# `brand` casa com o modificador .social-icon--<brand> do _sass/components/_social-share.scss,
# que define a cor da marca no hover.
social-network-links:
  - name: "GitHub"
    url: "https://github.com/danielwisky"
    icon: "fab fa-github"
    brand: "github"
    display: ["footer", "navbar"]
  - name: "LinkedIn"
    url: "https://www.linkedin.com/in/danielwisky"
    icon: "fab fa-linkedin"
    brand: "linkedin"
    display: ["footer", "navbar"]
  - name: "YouTube"
    url: "https://www.youtube.com/c/DanielWisky"
    icon: "fab fa-youtube"
    brand: "youtube"
    display: ["footer", "navbar"]
  - name: "Instagram"
    url: "https://www.instagram.com/danielwisky"
    icon: "fab fa-instagram"
    brand: "instagram"
    display: ["footer", "navbar"]
  - name: "3D Print"
    url: "https://wisky3dprint.com.br"
    icon: "fas fa-cube"
    brand: "print3d"
    display: ["footer"]

# Imagem de fallback nas redes sociais para as páginas que não são post. O
# jekyll-seo-tag só olha page.image, então precisa vir por defaults e não por
# uma chave solta no topo. Nos posts, _plugins/post_cover_image.rb sobrescreve
# com a capa da tag.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      image: "/assets/img/covers/og/default.jpg"

plugins:
  - jekyll-paginate-v2
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - README.md
  # ferramentas de build: geram assets, mas não fazem parte do site publicado
  - package.json
  - package-lock.json
  - scripts
  - "*.tmp.mjs"
  # os fontes do JS: só as versões .min.js são carregadas pelo site
  - assets/js/main.js
  - assets/js/search.js
  - assets/js/code-blocks.js
  - assets/js/contact.js