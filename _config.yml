title: Daniel Wisky
author: Daniel Wisky
email: daniel-ddw@hotmail.com
description: "Conteúdos sobre desenvolvimento de software e tecnologia"
baseurl: ""
url: https://danielwisky.com.br
lang: pt-BR

wisky_3dprint_url: "https://wisky3dprint.com.br"

sass:
  style: compressed
  # the 53 KB .map went to production and was never requested
  sourcemap: never

# output options (more information on Jekyll's site)
markdown: kramdown
highlighter: rouge
permalink: "/:year-:month-:day-:title/"

pagination:
  enabled: true
  per_page: 10
  permalink: '/page/:num/'
  title: ':title - página :num'
  sort_reverse: true

kramdown:
  input: GFM

# fill in your Google Analytics ID to track your website using Google Analytics
google_analytics: "G-R9ZHFE3RQ5"

# to use Disqus comments, sign up to https://disqus.com and fill in your Disqus shortname (NOT the userid)
disqus: "danielwisky"

# Formspree form ID, from formspree.io -> your form -> "Integration".
# The /f/ endpoint expects this ID, not an email: the dashboard even shows the URL
# with the email, but it responds FORM_NOT_FOUND. The ID is the same one that shows
# up as `formId` in the JS and React examples of the docs themselves.
formspree_id: "mzbovjdk"

# Public reCAPTCHA v3 site key, from google.com/recaptcha/admin. Not a
# secret — the key that actually protects is the secret key, set in the
# Formspree dashboard.
recaptcha_site_key: "6Le88tUtAAAAAD79aS6UJYPGfXnlWw-RxC8ufBQF"

# jekyll-seo-tag emits twitter:card; without this it would use "summary", with
# a small thumbnail. The username is needed because the plugin emits twitter:site
# regardless, and without it the tag comes out as an empty "@".
twitter:
  username: danielwisky
  card: summary_large_image

# --- footer social media links --- #
# `icon` is the id in the assets/img/icons.svg sprite.
# `brand` matches the .social-icon--<brand> modifier in _sass/components/_social-share.scss,
# which sets the brand color on hover.
social-network-links:
  - name: "GitHub"
    url: "https://github.com/danielwisky"
    icon: "github"
    brand: "github"
    display: ["footer", "navbar"]
  - name: "LinkedIn"
    url: "https://www.linkedin.com/in/danielwisky"
    icon: "linkedin"
    brand: "linkedin"
    display: ["footer", "navbar"]
  - name: "YouTube"
    url: "https://www.youtube.com/c/DanielWisky"
    icon: "youtube"
    brand: "youtube"
    display: ["footer", "navbar"]
  - name: "Instagram"
    url: "https://www.instagram.com/danielwisky"
    icon: "instagram"
    brand: "instagram"
    display: ["footer", "navbar"]
  - name: "3D Print"
    url: "https://wisky3dprint.com.br"
    icon: "cube"
    brand: "print3d"
    display: ["footer"]

# Fallback social image for pages that aren't posts. jekyll-seo-tag
# only looks at page.image, so it has to come via defaults and not via
# a loose top-level key. On posts, _plugins/post_cover_image.rb overrides it
# with the tag cover.
defaults:
  - scope:
      path: ""
      type: pages
    values:
      image: "/assets/img/covers/og/default.jpg"

plugins:
  - jekyll-paginate-v2
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - README.md
  # build tools: they generate assets, but aren't part of the published site
  - package.json
  - package-lock.json
  - scripts
  - lychee.toml
  - "*.tmp.*"
  # JS sources: only the .min.js versions are loaded by the site
  - assets/js/main.js
  - assets/js/search.js
  - assets/js/code-blocks.js
  - assets/js/contact.js